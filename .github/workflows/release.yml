name: 🚀 Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New version semver
        required: true
        type: string
      tag:
        description: NPM tag
        required: false
        type: string
        default: "latest"

permissions:
  contents: write
  id-token: write

jobs:
  from-template:
    uses: Unleash/.github/.github/workflows/npm-release.yml@v4.0.2
    with:
      version: ${{ github.event.inputs.version }}
      tag: ${{ github.event.inputs.tag }}
      # v4 default setup-command is pnpm; this repo uses yarn. The build happens
      # at publish time via `prepare` (npm runs it during npm publish).
      setup-command: yarn install --frozen-lockfile
    secrets:
      UNLEASH_BOT_APP_ID: ${{ secrets.UNLEASH_BOT_APP_ID }}
      UNLEASH_BOT_PRIVATE_KEY: ${{ secrets.UNLEASH_BOT_PRIVATE_KEY }}
